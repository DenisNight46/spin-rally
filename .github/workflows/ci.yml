name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Unit and realtime tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Browser render and input smoke test
        run: npm run verify
